<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Image Generator</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
  <script src="./js/my_design.js" defer></script>
  <script src="./js/sketch.js" defer></script>
</head>
<body class="play-shell">
  <main class="play-main circle-toy">
    <header class="play-bar">
      <h1>Circle Image Generator</h1>
      <div class="play-actions">
        <select id="dropper" aria-label="Inspiration image"></select>
        <button id="restart" type="button">Restart</button>
      </div>
    </header>

    <div class="circle-layout">
      <aside class="circle-controls">
        <label class="ctrl">
          <span>Mutation rate (<span id="rate"></span>%)</span>
          <input id="slider" type="range" min="1" max="100" value="100" />
        </label>
        <label class="ctrl">
          <span>Mutation cycles</span>
          <input id="thresholdInput" type="number" value="100" min="1" />
        </label>
        <label class="ctrl">
          <span>New circles / cycle</span>
          <input id="newCirclesInput" type="number" value="500" min="0" />
        </label>
        <label class="ctrl">
          <span>Min circle size</span>
          <input id="minRadiusInput" type="number" value="3" min="1" />
        </label>
        <label class="ctrl">
          <span>Max circle size</span>
          <input id="maxRadiusInput" type="number" value="5" min="1" />
        </label>
        <label class="ctrl">
          <span>Max total circles</span>
          <input id="maxCirclesInput" type="number" value="10000" min="100" />
        </label>
        <label class="ctrl">
          <span>Min alpha</span>
          <input id="minAlphaInput" type="number" min="0" max="255" value="60" />
        </label>
        <label class="ctrl">
          <span>Max alpha</span>
          <input id="maxAlphaInput" type="number" min="0" max="255" value="180" />
        </label>

        <div class="stats">
          <p>Active score: <span id="activeScore">—</span></p>
          <p>FPS: <span id="fpsCounter">—</span></p>
          <p>Circles: <span id="circleCounter">0</span></p>
          <p>Best score: <span id="bestScore">—</span></p>
          <div id="best"></div>
          <div id="memory" data-max-items="16"></div>
        </div>
      </aside>
      <div class="circle-stage">
        <div id="active"></div>
      </div>
    </div>
  </main>
</body>
</html>
