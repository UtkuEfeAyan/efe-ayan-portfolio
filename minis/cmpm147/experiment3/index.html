<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Tileset</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
  <script src="./js/sketch.js" defer></script>
</head>
<body class="play-shell">
  <main class="play-main">
    <header class="play-bar">
      <h1>Procedural Tileset</h1>
      <div class="play-actions">
        <button id="refresh-button" type="button">Refresh</button>
        <button id="fullscreen-button" type="button">Fullscreen</button>
        <span id="num_of_islands" class="play-meta"></span>
      </div>
    </header>
    <div id="canvas-container">
      <span id="canvasContainer" cols="40" rows="40"></span>
    </div>
    <textarea id="string-container" class="debug-grid" cols="40" rows="40" aria-hidden="true"></textarea>
  </main>
</body>
</html>
