<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal World</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<body class="play-shell">
  <main class="play-main">
    <header class="play-bar">
      <a class="back-btn" href="../../../../index.html">← My Website</a>
      <h1>Animal World</h1>
      <div class="play-actions">
        <button id="toggle-fullscreen" type="button">Fullscreen</button>
      </div>

    <div id="canvas-container">
      <div id="container"></div>
    </div>
    <div id="leaderboard" class="leaderboard">
      <h2>Leaderboard</h2>
      <p class="leaderboard-note">Local high scores, stored in this browser only.</p>
      <ol id="leaderboard-list"></ol>
      <button id="leaderboard-clear" type="button">Clear local scores</button>
    </div>
  </main>
