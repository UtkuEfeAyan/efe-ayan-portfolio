<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact // Efe Ayan</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">Portfolio</a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav-links" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a href="../about/index.html">About Me</a>
        <a href="../projects/index.html">Projects</a>
        <a href="../minis/index.html">Minis</a>
        <a href="../toys/index.html">Live Toys</a>
        <a class="active" href="index.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero container">
      <p class="eyebrow">Uplink</p>
      <h1>Contact</h1>
      <p class="lead" style="margin-top:0.75rem;">Have a project, collab, or just want to say hello?</p>
    </section>
    <section class="section" style="padding-top:0;">
      <div class="container contact-panel" style="max-width:560px;">
        <form class="form" id="contact-form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send Transmission</button>
          <p class="form-note">Opens your mail client. Update the address in <code>js/main.js</code>.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span>© <span id="y"></span> Efe Ayan</span>
      <a href="../index.html">Home →</a>
    </div>
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  <script src="../js/main.js"></script>
</body>
</html>
