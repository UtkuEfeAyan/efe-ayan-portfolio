name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify site files
        run: |
          node -v
          test -f index.html
          test -f css/styles.css
          test -f js/main.js
          echo "Static site ready for Pages (Node $(node -v))"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage publish directory
        run: |
          mkdir -p _site
          cp -R index.html .nojekyll css js about assets lab narrative projects series _site/
          # Keep README out of the published site root noise if desired; optional copy:
          # cp README.md _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
